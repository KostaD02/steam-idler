name: Docker

on:
  workflow_call:
    inputs:
      dist-artifact:
        description: Name of the internal dist artifact uploaded by the build
        required: true
        type: string
    outputs:
      client-url:
        value: ${{ jobs.docker.outputs.client-url }}
      server-url:
        value: ${{ jobs.docker.outputs.server-url }}
      client-tar:
        value: ${{ jobs.docker.outputs.client-tar }}
      server-tar:
        value: ${{ jobs.docker.outputs.server-tar }}

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    outputs:
      client-url: ${{ steps.upload-client.outputs.artifact-url }}
      server-url: ${{ steps.upload-server.outputs.artifact-url }}
      client-tar: ${{ steps.names.outputs.client }}
      server-tar: ${{ steps.names.outputs.server }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute names
        id: names
        env:
          PR: ${{ github.event.pull_request.number }}-${{ github.event.pull_request.commits }}
        run: |
          {
            echo "client=Steam-Idler-Client-PR-${PR}.tar"
            echo "server=Steam-Idler-Server-PR-${PR}.tar"
            echo "tag=pr-${PR}"
          } >> "$GITHUB_OUTPUT"

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist

      - uses: docker/setup-buildx-action@v4

      - name: Build client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.client
          push: false
          tags: steam-idler-client:${{ steps.names.outputs.tag }}
          outputs: type=docker,dest=/tmp/${{ steps.names.outputs.client }}

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          push: false
          tags: steam-idler-server:${{ steps.names.outputs.tag }}
          outputs: type=docker,dest=/tmp/${{ steps.names.outputs.server }}

      - name: Upload client image
        id: upload-client
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.client }}
          path: /tmp/${{ steps.names.outputs.client }}
          if-no-files-found: error

      - name: Upload server image
        id: upload-server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.server }}
          path: /tmp/${{ steps.names.outputs.server }}
          if-no-files-found: error
